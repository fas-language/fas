name: Linux x86-64 linker

on:
  pull_request:
    paths: ['src/**', 'bin/**', 'test/**', 'dune*', '.github/workflows/linker.yml']
  push:
    paths: ['src/**', 'bin/**', 'test/**', 'dune*', '.github/workflows/linker.yml']
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

concurrency:
  group: linker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install independent toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils clang lld gdb python3 tcl-dev
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3
        with:
          ocaml-compiler: '5.4.1'
      - name: Install build tool
        run: opam install -y dune.3.24.2
      - name: Fetch pinned C sources and build isolated musl
        run: |
          python3 src/linker/corpus/fetch.py musl --output "$RUNNER_TEMP/linker-musl" --build-musl
          python3 src/linker/corpus/fetch.py zlib --output "$RUNNER_TEMP/linker-zlib"
          python3 src/linker/corpus/fetch.py chibicc --output "$RUNNER_TEMP/linker-chibicc-source"
          python3 src/linker/corpus/fetch.py sqlite --output "$RUNNER_TEMP/linker-sqlite-source"
      - name: Build and run linker regressions
        run: |
          set -o pipefail
          opam exec -- dune build --profile release src/linker/bin/main.exe
          FAS_MUSL_SYSROOT="$RUNNER_TEMP/linker-musl/sysroot" \
            opam exec -- dune runtest --profile release src/linker 2>&1 | tee "$RUNNER_TEMP/linker-regressions.log"
      - name: Replay large inputs
        run: |
          python3 src/linker/scale/run.py _build/default/src/linker/bin/main.exe \
            --output "$RUNNER_TEMP/linker-scale" --profile full
      - name: Upstream zlib build and runtime matrix
        run: |
          for mode in dynamic static static-pie; do
            flags=()
            if [ "$mode" != dynamic ]; then flags+=("--$mode"); fi
            python3 src/linker/corpus/run.py --output "$RUNNER_TEMP/linker-zlib-$mode" \
              --zlib "$RUNNER_TEMP/linker-zlib/zlib-1.3.1" "${flags[@]}"
          done
      - name: Upstream Chibicc self-host and compiler drivers
        run: |
          python3 src/linker/corpus/run.py --output "$RUNNER_TEMP/linker-chibicc-selfhost" \
            --chibicc-selfhost "$RUNNER_TEMP/linker-chibicc-source/chibicc-90d1f7f199cc55b13c7fdb5839d1409806633fdb"
      - name: SQLite libraries, native Fas and upstream tests
        run: |
          flags=()
          if [[ "${{ github.event_name }}" == schedule || "${{ github.event_name }}" == workflow_dispatch ]]; then
            flags+=(--sqlite-extraquick)
          fi
          python3 src/linker/corpus/run.py --output "$RUNNER_TEMP/linker-sqlite" \
            --sqlite "$RUNNER_TEMP/linker-sqlite-source/sqlite-src-3540100" "${flags[@]}"
      - name: Staged install smoke check
        run: |
          opam exec -- make -C src/linker install DESTDIR="$RUNNER_TEMP/linker-install" PREFIX=/usr
          "$RUNNER_TEMP/linker-install/usr/bin/fas-ld" --version
          as -o "$RUNNER_TEMP/install-start.o" src/linker/test/fixtures/start.s
          as -o "$RUNNER_TEMP/install-support.o" src/linker/test/fixtures/support.s
          "$RUNNER_TEMP/linker-install/usr/bin/fas-ld" -o "$RUNNER_TEMP/install-program" \
            "$RUNNER_TEMP/install-start.o" "$RUNNER_TEMP/install-support.o"
          "$RUNNER_TEMP/install-program"
      - name: Retain qualification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linker-correctness-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/linker-regressions.log
            ${{ runner.temp }}/linker-scale
            ${{ runner.temp }}/linker-zlib-*
            ${{ runner.temp }}/linker-chibicc-*
            ${{ runner.temp }}/linker-sqlite*/report.json
            ${{ runner.temp }}/linker-sqlite*/commands.jsonl
            ${{ runner.temp }}/linker-sqlite*/tools
            ${{ runner.temp }}/linker-sqlite*/source.json
            ${{ runner.temp }}/linker-sqlite/sqlite/build/upstream-*/testrunner.log
            ${{ runner.temp }}/linker-sqlite/sqlite/build/upstream-*/testrunner.db
            ${{ runner.temp }}/linker-sqlite/sqlite/build/linker-invocations.jsonl
            ${{ runner.temp }}/linker-musl/source.json
            ${{ runner.temp }}/linker-musl/build.log
            _build/log

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install fuzz and seed toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils clang lld afl++ python3
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3
        with:
          ocaml-compiler: '5.4.1'
      - run: opam install -y dune.3.24.2
      - name: Coverage-guided campaigns
        run: |
          opam exec -- python3 src/linker/fuzz/run.py \
            --output "$RUNNER_TEMP/linker-fuzz" --seconds 600
      - name: Retain target, seeds, queues and findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linker-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: ${{ runner.temp }}/linker-fuzz
