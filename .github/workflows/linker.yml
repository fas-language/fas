name: Linux x86-64 linker

on:
  pull_request:
    paths: ['src/**', 'bin/**', 'test/**', 'dune*', '.github/workflows/linker.yml']
  push:
    paths: ['src/**', 'bin/**', 'test/**', 'dune*', '.github/workflows/linker.yml']
  workflow_dispatch:
    inputs:
      suite:
        description: Qualification selection
        required: true
        default: all
        type: choice
        options: [all, correctness, popular-c, gcc-torture, fuzz]
      fuzz_seconds:
        description: Seconds per fuzz target (2 is artifact-upload smoke only)
        required: true
        default: '600'
        type: choice
        options: ['600', '2']
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

concurrency:
  group: linker-${{ github.ref }}-${{ github.event_name }}-${{ inputs.suite || 'all' }}
  cancel-in-progress: true

jobs:
  correctness:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'correctness'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install independent toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils clang lld gdb valgrind python3 tcl-dev file
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3
        with:
          ocaml-compiler: '5.4.1'
      - name: Install build tool
        run: opam install -y dune.3.24.2
      - name: Clean correctness recipe, upstream corpora and staged install
        env:
          FAS_SQLITE_EXTRAQUICK: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: opam exec -- bash src/linker/ci/correctness.sh
      - name: Retain qualification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linker-correctness-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/linker-regressions.log
            ${{ runner.temp }}/qualification-summary.json
            ${{ runner.temp }}/packages.tsv
            ${{ runner.temp }}/release-source-manifest.json
            ${{ runner.temp }}/linker-release
            ${{ runner.temp }}/release-smoke.json
            ${{ runner.temp }}/linker-install
            ${{ runner.temp }}/install-program
            ${{ runner.temp }}/linker-scale
            ${{ runner.temp }}/linker-semantic
            ${{ runner.temp }}/linker-zlib-*
            ${{ runner.temp }}/linker-chibicc-*
            ${{ runner.temp }}/linker-sqlite*/report.json
            ${{ runner.temp }}/linker-sqlite*/commands.jsonl
            ${{ runner.temp }}/linker-sqlite*/tools
            ${{ runner.temp }}/linker-sqlite*/source.json
            ${{ runner.temp }}/linker-sqlite/sqlite/build/upstream-*/testrunner.log
            ${{ runner.temp }}/linker-sqlite/sqlite/build/upstream-*/testrunner.db
            ${{ runner.temp }}/linker-sqlite/sqlite/build/linker-invocations.jsonl
            ${{ runner.temp }}/linker-musl/source.json
            ${{ runner.temp }}/linker-musl/build.log
            ${{ runner.temp }}/linker-musl-zlib
            _build/log

  fuzz:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'fuzz'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install fuzz and seed toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils clang lld afl++ python3
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3
        with:
          ocaml-compiler: '5.4.1'
      - run: opam install -y dune.3.24.2
      - name: Coverage-guided campaigns
        env:
          FAS_FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '600' }}
          FAS_EXPECTED_HEAD: ${{ github.sha }}
        run: |
          opam exec -- python3 src/linker/fuzz/run.py \
            --output "$RUNNER_TEMP/linker-fuzz" --seconds "$FAS_FUZZ_SECONDS"
          python3 src/linker/fuzz/verify.py \
            --report "$RUNNER_TEMP/linker-fuzz/report.json" \
            --seconds "$FAS_FUZZ_SECONDS" --head "$FAS_EXPECTED_HEAD" \
            --output "$RUNNER_TEMP/linker-fuzz/verification.json"
      - name: Archive original AFL filenames for portable artifact upload
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/linker-fuzz" ]; then
            tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/linker-fuzz.tar.gz" linker-fuzz
          fi
      - name: Retain target, seeds, queues and findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linker-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          compression-level: 0
          path: |
            ${{ runner.temp }}/linker-fuzz.tar.gz
            ${{ runner.temp }}/linker-fuzz/report.json
            ${{ runner.temp }}/linker-fuzz/verification.json

  popular-c:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'popular-c'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: lua
            directory: lua-5.1.5
          - project: bzip2
            directory: bzip2-1.0.8
          - project: libpng
            directory: libpng-1.6.47
          - project: libarchive
            directory: libarchive-3.8.11
          - project: curl
            directory: curl-8.14.1
          - project: redis
            directory: redis-7.2.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install upstream build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils lld python3 cmake pkg-config perl tcl \
            valgrind libssl-dev zlib1g-dev liblzma-dev libzstd-dev libxml2-dev libidn2-dev
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3
        with:
          ocaml-compiler: '5.4.1'
      - run: opam install -y dune.3.24.2
      - name: Build linker and fetch pinned source
        run: |
          opam exec -- dune build --profile release src/linker/bin/main.exe
          python3 src/linker/corpus/fetch.py "${{ matrix.project }}" --output "$RUNNER_TEMP/popular-source"
      - name: Upstream tests and same-object GNU replay
        run: |
          python3 src/linker/corpus/popular.py --output "$RUNNER_TEMP/popular-results" \
            --project "${{ matrix.project }}" "$RUNNER_TEMP/popular-source/${{ matrix.directory }}"
      - name: Independent shared-library consumers and GNU configure control
        if: matrix.project == 'bzip2' || matrix.project == 'libpng' || matrix.project == 'libarchive' || matrix.project == 'curl'
        run: |
          python3 src/linker/corpus/cross.py --corpus "$RUNNER_TEMP/popular-results" \
            --project "${{ matrix.project }}" --output "$RUNNER_TEMP/popular-cross"
      - name: Thin archives and mixed partial-link runtime qualification
        if: matrix.project == 'lua' || matrix.project == 'libarchive'
        run: |
          python3 src/linker/corpus/archive_pipeline.py --corpus "$RUNNER_TEMP/popular-results" \
            --project "${{ matrix.project }}" --lld ld.lld \
            --output "$RUNNER_TEMP/popular-archive-pipelines"
      - name: Retain source pins, binaries, inputs and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linker-popular-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/popular-results
            ${{ runner.temp }}/popular-cross
            ${{ runner.temp }}/popular-archive-pipelines
            ${{ runner.temp }}/popular-source/source.json
            _build/log

  gcc-torture:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'gcc-torture'))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # Official GCC 15.2.0 image, immutable multi-platform manifest digest.
    container: gcc:15.2.0@sha256:3ae15afe768b06d0c0fe088d822ba5f8045c26630bdacc8d8e7713cf5d8e7289
    env:
      # Use container paths consistently in shell steps and JavaScript actions.
      FAS_GCC_ROOT: /tmp/fas-linker-gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install official test runner and build tools
        run: |
          apt-get update
          apt-get install -y python3 git binutils dejagnu expect curl unzip bzip2 make patch
          gcc -dumpfullversion
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3
        with:
          ocaml-compiler: '5.4.1'
          # Match the local Docker recipe, without an additional Bubblewrap sandbox.
          opam-disable-sandboxing: true
      - run: opam install -y dune.3.24.2
      - name: Build linker and fetch official pinned tests
        run: |
          opam exec -- dune build --profile release src/linker/bin/main.exe
          python3 src/linker/corpus/fetch.py gcc-torture --output "$FAS_GCC_ROOT/source"
      - name: Official C torture execution corpus, native objects without stack trampolines
        run: |
          python3 src/linker/corpus/torture.py --gcc-source "$FAS_GCC_ROOT/source/gcc-15.2.0" \
            --output "$FAS_GCC_ROOT/results" --no-trampolines --timeout 6600 \
            --expected-executions 4974
      - name: Retain official summaries, logs, native inputs and wrappers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linker-gcc-torture-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ env.FAS_GCC_ROOT }}/results
            ${{ env.FAS_GCC_ROOT }}/source/source.json
            _build/log
