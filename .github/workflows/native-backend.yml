name: Native backend

# Checks of the native (MIR) backend that need no LLVM: the allocation
# checker, the Fir conformance programs (static PIE and -no-pie executables,
# C interop through the system C compiler), byte-identical output across
# runs, and the -g line tables. The comparisons against LLVM (shadow run, IR fuzzer, difftests) need
# LLVM 22 and run locally; see src/backend/mir/README.md.

on:
  pull_request:
    paths: ['src/**', 'bin/**', 'tools/fas_fir/**', 'test/**', 'dune*', '.github/workflows/native-backend.yml']
  push:
    paths: ['src/**', 'bin/**', 'tools/fas_fir/**', 'test/**', 'dune*', '.github/workflows/native-backend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-backend-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install C compilers and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils clang
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3
        with:
          ocaml-compiler: '5.4.1'
      - name: Install build tool
        run: opam install -y dune.3.24.2
      - name: Build
        run: opam exec -- dune build bin/main.exe tools/fas_fir/fas_fir.exe test/mir_check_test.exe
      - name: Allocation checker and its mutation test
        run: cd test && ../_build/default/test/mir_check_test.exe
      - name: Fir conformance programs
        run: FAS_CC=clang sh test/fas_fir.sh  # wide.c needs _BitInt (gcc 13 has none)
      - name: Deterministic output
        run: sh test/native_determinism.sh
      - name: Debug info (-g) changes no code, line tables decode
        run: sh test/native_debug.sh
